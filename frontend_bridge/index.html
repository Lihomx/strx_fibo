<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>TV Click Bridge</title>
  <style>
    body, html { margin: 0; padding: 0; overflow: hidden; height: 0px; width: 0px; background: transparent; }
  </style>
</head>
<body>
<script>
(function() {
  function sendToStreamlit(type, data) {
    var outData = Object.assign({
      isStreamlitMessage: true,
      type: type
    }, data || {});
    window.parent.postMessage(outData, "*");
  }

  function init() {
    sendToStreamlit("streamlit:componentReady", { apiVersion: 1 });
    sendToStreamlit("streamlit:setFrameHeight", { height: 0 });
  }

  var _lastSentTicker = "";
  var _lastSentTime = 0;

  function doSend(tk) {
    if (!tk) return;
    tk = String(tk).trim().toUpperCase();
    var now = Date.now();
    if (tk === _lastSentTicker && (now - _lastSentTime) < 600) return;
    _lastSentTicker = tk;
    _lastSentTime = now;
    sendToStreamlit("streamlit:setComponentValue", {
      value: {
        ticker: tk,
        ts: now
      }
    });
  }

  // 监听来自主窗口的点击通知
  window.addEventListener("message", function(e) {
    if (e.data && e.data.type === "record_tv_click" && e.data.ticker) {
      doSend(e.data.ticker);
    }
  });

  // 直接在 parent window 暴露快捷函数
  try {
    window.parent.__sendTvClickToStreamlit = function(ticker) {
      doSend(ticker);
    };
  } catch(err) {}

  if (document.readyState === "complete" || document.readyState === "interactive") {
    init();
  } else {
    window.addEventListener("DOMContentLoaded", init);
  }
})();
</script>
</body>
</html>
